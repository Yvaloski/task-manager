<div class="min-h-screen bg-slate-100 p-6">
  <div class="max-w-2xl mx-auto">
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-3xl font-bold text-slate-800">🗂️ Catégories</h1>
        <p class="text-slate-500 text-sm mt-1">Gérez vos catégories de tâches</p>
      </div>
      <a routerLink="/" class="px-4 py-2 bg-white border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-50 transition font-medium text-sm shadow-sm">
        ← Retour aux tâches
      </a>
    </div>

    <!-- Formulaire ajout -->
    <div class="bg-white rounded-xl shadow-sm p-6 mb-6">
      <h2 class="text-lg font-semibold text-slate-700 mb-4">Nouvelle catégorie</h2>
      <div class="grid grid-cols-2 gap-4 mb-4">
        <div>
          <label class="text-sm font-semibold text-slate-600 block mb-1">Nom *</label>
          <input [(ngModel)]="newName" type="text" placeholder="Ex: Travail"
                 class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-300 outline-none" />
        </div>
        <div>
          <label class="text-sm font-semibold text-slate-600 block mb-1">Description</label>
          <input [(ngModel)]="newDescription" type="text" placeholder="Optionnelle..."
                 class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-300 outline-none" />
        </div>
      </div>
      <button (click)="create()" [disabled]="isSaving || !newName.trim()"
              class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm hover:bg-indigo-700 transition font-medium disabled:opacity-60">
        {{ isSaving ? 'Création...' : '+ Ajouter' }}
      </button>
    </div>

    <!-- Liste des catégories -->
    <div class="space-y-3">
      <div *ngIf="categories.length === 0" class="text-center py-12 bg-white rounded-xl shadow-sm text-slate-400">
        <p class="text-4xl mb-2">📂</p>
        <p>Aucune catégorie. Créez-en une !</p>
      </div>
      <div *ngFor="let cat of categories" class="bg-white rounded-xl shadow-sm p-4 flex justify-between items-center hover:shadow-md transition">
        <div>
          <p class="font-semibold text-slate-800">{{ cat.name }}</p>
          <p class="text-sm text-slate-500">{{ cat.description || 'Aucune description' }}</p>
        </div>
        <button (click)="delete(cat.id)" class="px-3 py-1.5 text-xs bg-red-50 text-red-600 rounded-lg hover:bg-red-100 font-semibold transition">
          🗑️ Supprimer
        </button>
      </div>
    </div>
  </div>
</div>
